# qc-agent:generated — gate tự động của repo này. Ghim @<commit SHA> (không @main) và image theo digest.
# Xem docs/usage-ci.md trong repo qc-agent. Bật chặn merge: branch protection yêu cầu job `qc-agent / full-stack-fastapi-template` xanh.
name: qc-gate
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      workers:
        description: "vd semgrep,schemathesis — để trống = toàn bộ theo policy"
        type: string
        default: ""

jobs:
  ghcr-access:
    name: Verify GHCR access
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check PAT and image manifest (no secret output)
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ghcr.io/minhduc-it/qc-agent@sha256:95c55978ec52316e648c07c6f11ff780a930db3950d285504473d43965c6c785
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, sys
          import urllib.error, urllib.request
          secret = os.environ.get("GHCR_PULL_TOKEN", "").strip()
          if not secret:
              sys.exit("GHCR_PULL_TOKEN is missing in this repository/run")
          print("GHCR_PULL_TOKEN is present (value withheld)")
          basic = base64.b64encode((os.environ["GHCR_USER"] + ":" + secret).encode()).decode()
          def fetch(url, headers, label):
              try:
                  response = urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30)
              except urllib.error.HTTPError as error:
                  sys.exit(f"{label}: HTTP {error.code}; check PAT read:packages and package access")
              except urllib.error.URLError:
                  sys.exit(f"{label}: network error")
              print(f"{label}: HTTP {response.status}")
              return response
          response = fetch("https://ghcr.io/token?service=ghcr.io&scope=repository:minhduc-it/qc-agent:pull", {"Authorization": "Basic " + basic}, "GHCR token request")
          bearer = json.load(response)["token"]
          headers = {"Authorization": "Bearer " + bearer, "Accept": "application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json"}
          digest = os.environ["IMAGE"].split("@", 1)[1]
          response = fetch("https://ghcr.io/v2/minhduc-it/qc-agent/manifests/" + digest, headers, "Pinned manifest")
          body = response.read()
          actual = "sha256:" + hashlib.sha256(body).hexdigest()
          if actual != digest:
              sys.exit("Registry response digest does not match pinned image")
          print("Pinned digest verified:", actual)
          index = json.loads(body)
          linux = [item for item in index.get("manifests", []) if item.get("platform", {}).get("os") == "linux" and item.get("platform", {}).get("architecture") == "amd64"]
          if linux:
              fetch("https://ghcr.io/v2/minhduc-it/qc-agent/manifests/" + linux[0]["digest"], headers, "Linux/amd64 manifest").close()
          PY

  qc:
    needs: ghcr-access
    permissions:               # quyền TỐI THIỂU; workflow tái sử dụng không xin thêm
      contents: read
      checks: write            # Check Run "qc-agent / full-stack-fastapi-template"
      pull-requests: write     # comment dính trên PR
      packages: read           # kéo image từ GHCR
    uses: Muteen-Felix/QC-Agent/.github/workflows/qc-gate.reusable.yml@4183af5c3365e493a1d339a1c73e9485856c0f55
    with:
      project: full-stack-fastapi-template
      image: ghcr.io/minhduc-it/qc-agent@sha256:95c55978ec52316e648c07c6f11ff780a930db3950d285504473d43965c6c785
      workers: ${{ inputs.workers }}   # chạy tay: danh sách worker (rỗng = theo policy); PR: luôn rỗng
      sut_dockerfile: ".qc-agent/Dockerfile.ci"
      sut_context: "."
      sut_health_path: "/api/v1/utils/health-check/"
      sut_env: |
        PROJECT_NAME=QC FastAPI CI
        FRONTEND_HOST=http://sut:8000
      # SUT cần database (tuỳ chọn, mặc định KHÔNG bật): bỏ comment và điền khi SUT không khởi động được chỉ bằng sut_env. Xem docs/usage-ci.md, mục "SUT cần database".
      # sut_db_image: <image DB>@sha256:<DIGEST>                   # ghim digest; loại DB do SUT chọn
      # sut_db_env: |                                              # KHÔNG đặt bí mật ở đây
      #   POSTGRES_DB=app
      # sut_db_ready_cmd: pg_isready -h 127.0.0.1 -U app           # exit 0 = DB sẵn sàng (hoặc dùng sut_db_port: "5432")
      # Bí mật đặt ở secret của repo SUT (nhiều dòng KEY=VALUE): SUT_SECRET_ENV cho SUT (DATABASE_URL=...@db:5432/app), SUT_DB_SECRET_ENV chỉ cho container db.
      # SUT đã chạy sẵn ở nơi khác thì khai sut_base_url thay cho cả build/chạy SUT lẫn DB.
      sut_db_image: postgres@sha256:86e0b703649d7a792bd9243ee28afc9d8f7c6b2b5638077c9d6882d4d472bbfd
      sut_db_env: |
        POSTGRES_DB=app
        POSTGRES_USER=app
      sut_db_ready_cmd: pg_isready -h 127.0.0.1 -U app -d app
    secrets: inherit
